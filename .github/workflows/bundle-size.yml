name: Bundle size

on:
  pull_request:
    paths:
      - "packages/**"
      - "!packages/*/README.md"
      - "!packages/*/CHANGELOG.md"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - "bunfig.toml"
      - "vite.config.ts"
      - "tsconfig*.json"
      - "patches/**"
      - ".github/actions/**"
      - ".github/workflows/bundle-size.yml"

permissions:
  contents: read

concurrency:
  group: bundle-size-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  compare:
    name: Compare consumer bundles
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bundle-base
          persist-credentials: false

      - name: Set up CI
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          task-cache: build

      # Each checkout installs its own lockfile and keeps its task results.
      # Vite's command fingerprints differ between these checkout paths.
      - name: Install base dependencies
        uses: ./.github/actions/run-ci
        with:
          timeout: 3m
          retry-errors: "true"
          working-directory: .bundle-base
          command: vp install --frozen-lockfile --ignore-scripts

      - name: Restore base Vite Task cache
        id: base-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bundle-base/node_modules/.vite/task-cache
          key: vite-task-bundle-base-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-bundle-base-${{ runner.os }}-${{ runner.arch }}-

      - name: Build base packages
        id: base
        uses: ./.github/actions/run-ci
        with:
          timeout: 5m
          working-directory: .bundle-base
          command: |
            vp run --no-cache patch:tsgo
            vp run -F './packages/*' build

      - name: Build PR packages
        id: head
        uses: ./.github/actions/run-ci
        with:
          timeout: 5m
          command: vp run -F './packages/*' build

      - name: Compare bundles
        run: vp run bundle:compare -- --base-dir .bundle-base

      - name: Save base Vite Task cache
        if: ${{ !cancelled() && (steps.base.outcome == 'success' || steps.base.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bundle-base/node_modules/.vite/task-cache
          key: ${{ steps.base-cache.outputs.cache-primary-key }}

      - name: Save Vite Task cache
        if: ${{ !cancelled() && (steps.head.outcome == 'success' || steps.head.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.setup.outputs.cache-key }}

      - name: Show comparison
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "$PR_NUMBER" > .bundle-report/pr-number.txt
          echo 'Minified ESM, es2022, browser target, all dependencies included. Gzip level 9 per chunk.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Initial includes static shared chunks; deferred is the remaining output. New exports have no baseline.' >> "$GITHUB_STEP_SUMMARY"
          cat .bundle-report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload size report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-stats
          path: |
            .bundle-report/report.md
            .bundle-report/report.json
            .bundle-report/pr-number.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload emitted chunks and module analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-analysis
          path: |
            .bundle-report/base
            .bundle-report/head
          if-no-files-found: error
          retention-days: 7
