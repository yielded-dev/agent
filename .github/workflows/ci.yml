# Every PR reports `ready`, including changes that need only formatting and
# workflow validation. Path selection never removes the required workflow.
#
# Main also publishes the validated Action bundle on distribution tags.
# PR caches remain scoped to their merge refs. Each job has a separate cache
# namespace, and Vite Task checks each task's inputs before replaying it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Retargeting a PR changes its diff without changing the head commit.
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  # Let main finish publishing a baseline while newer PR runs supersede old ones.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  changes:
    name: Select required checks
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      pull-requests: read
    outputs:
      full: ${{ steps.paths.outputs.full }}
      docs: ${{ steps.paths.outputs.docs }}
    steps:
      - name: Classify the complete PR diff
        id: paths
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          retries: 2
          script: |
            const pr = context.payload.pull_request;
            // Main supplies complete release evidence and warms every task cache.
            // Release PRs must retain builds and paid gates even for metadata only.
            let full = !pr || (pr.base.ref === 'main' &&
              pr.head.ref === 'changeset-release/main' &&
              pr.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo);
            let docs = false;
            if (!full) {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo, pull_number: pr.number, per_page: 100,
                });
                const { data: current } = await github.rest.pulls.get({
                  ...context.repo, pull_number: pr.number,
                });
                // The API caps its file listing. Incomplete or moved diffs must
                // never authorize skips, including renames out of source paths.
                if (!files.length || files.length !== current.changed_files ||
                    current.head.sha !== pr.head.sha || current.base.sha !== pr.base.sha) {
                  full = true;
                } else {
                  const passive = /^(?:[^/]+\.md|LICENSE|docs\/TOOLCHAIN\.md|action\/README\.md|(?:packages|examples|tooling)\/[^/]+\/(?:README|CHANGELOG)\.md|\.changeset\/[^/]+\.md)$/;
                  for (const file of files) {
                    for (const path of [file.filename, file.previous_filename].filter(Boolean)) {
                      // Changes to the commands or setup that run CI exercise
                      // the full gate. Other workflows get actionlint below.
                      if (path === '.github/workflows/ci.yml' || path.startsWith('.github/actions/')) {
                        full = true;
                      } else if (passive.test(path) || /^(?:\.agents|\.claude|\.opencode)\//.test(path) ||
                          /^\.github\/(?:workflows\/[^/]+\.ya?ml|assets\/.*|[^/]+\.md)$/.test(path)) {
                        continue;
                      } else if (path.startsWith('docs/')) {
                        docs = true;
                      } else {
                        // Unknown paths are executable inputs until classified.
                        full = true;
                      }
                    }
                  }
                }
              } catch (error) {
                core.warning(`Cannot prove a limited diff; running full CI: ${error.message}`);
                full = true;
              }
            }
            core.setOutput('full', String(full));
            core.setOutput('docs', String(docs && !full));
            await core.summary.addRaw(full ? 'Full checks, tests, and builds required.' :
              docs ? 'Formatting, workflow validation, and docs checks/build required.' :
              'Formatting and workflow validation required.').write();

  release-proof:
    name: Verify release equivalence
    # Eligibility is only a cost filter. Ordinary main pushes start CI without
    # installing a verifier that only recognizes version merges. The trusted
    # base verifier still checks every changed byte/mode and all CI evidence.
    if: >-
      ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore: version packages') ||
          github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'changeset-release/main' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Setup/API failures must select ordinary CI, including bootstrap before this
    # verifier first exists on main. An absent output can never authorize reuse.
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      fast: ${{ steps.proof.outcome == 'success' && steps.proof.outputs.fast == 'true' }}
      build-run: ${{ steps.proof.outputs.build-run }}
      build-attempt: ${{ steps.proof.outputs.build-attempt }}
      base: ${{ steps.proof.outputs.base }}
      head: ${{ steps.proof.outputs.head }}
    steps:
      - name: Check out trusted base verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version: "24.20.0"
          run-install: false
          cache: true

      - name: Install trusted base dependencies
        uses: ./.github/actions/run-ci
        with:
          timeout: 1m
          retry-errors: "true"
          command: vp install --frozen-lockfile --ignore-scripts

      - name: Prove release equivalence and ordinary base CI
        id: proof
        run: ./node_modules/.bin/vp run ci:release-proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
          RELEASE_PR: ${{ github.event.pull_request.number }}

  checks:
    name: Static checks
    needs: [changes, release-proof]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.release-proof.outputs.fast != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CI
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          task-cache: checks

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color -shellcheck= -pyflakes=

      - name: Check formatting for a limited diff
        id: format
        if: needs.changes.outputs.full != 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 2m
          command: vp run ci:format

      - name: Format, lint, and type checks
        id: checks
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/run-ci
        with:
          timeout: 8m
          command: vp run check

      - name: Save Vite Task cache
        if: ${{ !cancelled() && (steps.checks.outcome == 'success' || steps.checks.outcome == 'failure' || steps.format.outcome == 'success') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.setup.outputs.cache-key }}

  test:
    name: Tests (${{ matrix.suite }})
    needs: [changes, release-proof]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' && needs.release-proof.outputs.fast != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Each suite already starts a full Vitest/workerd worker pool. Running
    # the heavy suites together oversubscribes one runner and can starve the
    # crash fixtures' ownership-lease renewals. Keep their runners separate.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: workspace
            filters: >-
              -F './packages/*'
              -F './examples/*'
              -F './tooling/*'
              -F '!@yielded/agent-platform-node'
              -F '!@yielded/agent-testing'
              -F '!@yielded/agent-storage-postgres'
              -F '!@yielded/agent-platform-cloudflare'
              -F '!@yielded/agent-storage-cloudflare'
              -F '!@yielded/agent-example-travel-planner'
              -F '!@yielded/agent-example-context-continuity-eval'
              -F '!@yielded/agent-example-runtime-benchmark'
          - suite: travel-planner
            filters: -F @yielded/agent-example-travel-planner
          - suite: context-continuity
            filters: -F @yielded/agent-example-context-continuity-eval
          - suite: runtime-benchmark
            filters: -F @yielded/agent-example-runtime-benchmark
          - suite: platform-node
            filters: -F @yielded/agent-platform-node
          - suite: testing
            filters: -F @yielded/agent-testing
            postgres: "17"
          # The adapter supports Postgres 16 and newer; the ends of that range are
          # the versions worth spending a runner on.
          - suite: storage-postgres-16
            filters: -F @yielded/agent-storage-postgres
            postgres: "16"
          - suite: storage-postgres-18
            filters: -F @yielded/agent-storage-postgres
            postgres: "18"
          - suite: platform-cloudflare
            filters: -F @yielded/agent-platform-cloudflare
            # Worker-pool storage survives test retries. Retry the whole task
            # in a fresh process instead of reusing a failed attempt's state.
            stateful: true
          - suite: storage-cloudflare
            filters: -F @yielded/agent-storage-cloudflare
            stateful: true
    services:
      postgres:
        image: ${{ matrix.postgres && format('postgres:{0}-alpine', matrix.postgres) || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: effect_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CI
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          # Live Postgres tasks are deliberately uncached.
          task-cache: ${{ !matrix.postgres && format('test-v2-{0}', matrix.suite) || '' }}

      - name: Run workspace test suites
        id: tests
        env:
          EFFECT_AGENT_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgres://postgres:postgres@localhost:5432/effect_agent' || '' }}
        uses: ./.github/actions/run-ci
        with:
          # Retry a hung process once, within the outer job budget. Vitest
          # retries individual timeouts except in the shared-storage suites.
          timeout: 8m
          retry-errors: ${{ matrix.stateful && 'true' || 'false' }}
          command: >-
            vp run -v --parallel --concurrency-limit 1
            --fail-if-no-match ${{ matrix.filters }} test
            --retry.count ${{ matrix.stateful && '0' || '2' }} --retry.delay 1000
            --retry.condition 'timed out|timeout|ETIMEDOUT|ESOCKETTIMEDOUT'

      # Vite Task never caches failed tasks. Retain successful siblings so
      # fixing one failure does not force the entire suite to run cold again.
      - name: Save Vite Task cache
        if: ${{ !cancelled() && steps.setup.outputs.cache-key != '' && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.setup.outputs.cache-key }}

  build:
    name: Build
    needs: [changes, release-proof]
    if: ${{ !cancelled() && needs.changes.outputs.full == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Set up CI
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          task-cache: build

      - name: Restore verified version PR build
        id: restore
        # Expired or corrupt artifacts require a fresh build; source equivalence
        # remains independently proven. Publication still fails on bad evidence.
        continue-on-error: true
        if: ${{ needs.release-proof.outputs.fast == 'true' && needs.release-proof.outputs.build-run != '' }}
        run: ./node_modules/.bin/vp run ci:release-build
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_BUILD_MODE: restore
          RELEASE_BUILD_RUN: ${{ needs.release-proof.outputs.build-run }}
          RELEASE_BUILD_ATTEMPT: ${{ needs.release-proof.outputs.build-attempt }}
          RELEASE_BASE: ${{ needs.release-proof.outputs.base }}
          RELEASE_HEAD: ${{ needs.release-proof.outputs.head }}

      - name: Build packages, examples, and docs
        id: build
        if: ${{ steps.restore.outcome != 'success' }}
        uses: ./.github/actions/run-ci
        with:
          timeout: 8m
          command: vp run -v build

      - name: Validate versioned release packages
        run: |
          ./node_modules/.bin/vp fmt --check
          ./node_modules/.bin/vp run check:exports
          ./node_modules/.bin/vp run verify:package-purity
          ./node_modules/.bin/vp run ci:release-packages

      - name: Record release build
        run: ./node_modules/.bin/vp run ci:release-build
        env:
          RELEASE_BUILD_MODE: write

      - name: Upload release build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: .release-build/build.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Action bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-review-action
          path: action/dist/index.mjs
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Save Vite Task cache
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.setup.outputs.cache-key }}

  docs:
    name: Build docs
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up CI
        id: setup
        uses: ./.github/actions/setup-ci
        with:
          # Mutually exclusive with the full build job; share its warm results.
          task-cache: build

      - name: Check and build documentation
        id: docs
        uses: ./.github/actions/run-ci
        with:
          timeout: 8m
          command: vp run ci:docs

      - name: Save Vite Task cache
        if: ${{ !cancelled() && (steps.docs.outcome == 'success' || steps.docs.outcome == 'failure') }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.setup.outputs.cache-key }}

  # Paid acceptance runs on the exact version PR head before it can merge.
  # Publication reuses the result for an identical merged tree.
  release-gates:
    name: Release gates
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: ./.github/workflows/release-gates.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
    secrets: inherit

  publish-action:
    name: Publish Action
    needs: [release-proof, checks, test, build]
    # A version merge can reuse ordinary source checks and the exact PR build.
    # Retained package checks must still succeed before publishing the Action.
    if: >-
      ${{ !cancelled() &&
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          ((needs.checks.result == 'success' && needs.test.result == 'success') ||
           (needs['release-proof'].result == 'success' && needs['release-proof'].outputs.fast == 'true' &&
            needs.checks.result == 'skipped' && needs.test.result == 'skipped')) &&
          needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out the validated source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download this run's Action bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-review-action
          path: action/dist

      # Keep publication outside the Effect build script: this job installs
      # no dependencies and executes no repository code with write authority.
      # Tags point to a child of the validated source commit. Neither main nor
      # feature branches ever receive the generated output.
      - name: Publish immutable source tag and advance action-v1
        shell: bash
        run: |
          set -euo pipefail
          CHANNEL_REF=refs/tags/action-v1
          RELEASE_REF="refs/tags/action-${GITHUB_SHA}"
          PREVIOUS_CHANNEL="$(git ls-remote origin "$CHANNEL_REF" | cut -f1)"
          LATEST_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$LATEST_MAIN" != "$GITHUB_SHA" ]; then
            echo "Skipping superseded source commit $GITHUB_SHA."
            exit 0
          fi
          EXISTING_RELEASE="$(git ls-remote origin "$RELEASE_REF" | cut -f1)"
          if [ -n "$EXISTING_RELEASE" ]; then
            echo "Action for $GITHUB_SHA is already published at $EXISTING_RELEASE."
            exit 0
          fi
          test -s action/dist/index.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --force action/dist/index.mjs
          git -c core.hooksPath=/dev/null commit -m "Build Action from $GITHUB_SHA"
          git push --atomic --force-with-lease="$CHANNEL_REF:$PREVIOUS_CHANNEL" origin \
            "HEAD:$RELEASE_REF" "HEAD:$CHANNEL_REF"
          echo "Published yielded-dev/agent/action@$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

  # Fan-in for branch protection: the required status check is named `ready`.
  # It runs even after a PR gate fails, and never posts a main-push ready check.
  ready:
    name: ready
    needs: [changes, release-proof, checks, test, build, docs, release-gates]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required gates passed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FULL: ${{ needs.changes.outputs.full }}
          DOCS: ${{ needs.changes.outputs.docs }}
          DOCS_RESULT: ${{ needs.docs.result }}
          RELEASE_FAST: ${{ needs.release-proof.outputs.fast }}
          PROOF_RESULT: ${{ needs.release-proof.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CHANGES_RESULT" = "success"
          case "$FULL/$DOCS" in
            true/false)
              test "$BUILD_RESULT" = "success"
              test "$DOCS_RESULT" = "skipped"
              ;;
            false/true|false/false)
              test "$RELEASE_FAST" != "true"
              test "$BUILD_RESULT" = "skipped"
              test "$TEST_RESULT" = "skipped"
              test "$CHECKS_RESULT" = "success"
              if [ "$DOCS" = "true" ]; then
                test "$DOCS_RESULT" = "success"
              else
                test "$DOCS_RESULT" = "skipped"
              fi
              exit 0
              ;;
            *) exit 1 ;;
          esac
          if [ "$RELEASE_FAST" = "true" ]; then
            test "$PROOF_RESULT" = "success"
            test "$CHECKS_RESULT" = "skipped"
            test "$TEST_RESULT" = "skipped"
          else
            test "$CHECKS_RESULT" = "success"
            test "$TEST_RESULT" = "success"
          fi

      # Publication reads this exact step as the version PR's gate evidence.
      - name: Verify release gates passed
        if: ${{ github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GATES_RESULT: ${{ needs.release-gates.result }}
        run: test "$GATES_RESULT" = "success"
