name: PR Review

on:
  # Review immediately using trusted code; PR source is read only through the API.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number for a full review
        required: true
        type: number

permissions:
  contents: read

jobs:
  # The generated version PR only carries changeset output, and CI's release
  # equivalence check verifies every changed byte. Pass the required check
  # without a model review; manual @effect-agent commands still run.
  version-pr:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'changeset-release/main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'effect-agent[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: pr-review
      deployment: false
    steps:
      - name: Mint the Effect Agent GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Pass the review check
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/check-runs" \
            -f name="Effect Agent review" -f head_sha="$HEAD_SHA" \
            -f status=completed -f conclusion=success \
            -f "output[title]=Generated version PR" \
            -f "output[summary]=Changeset output verified by release equivalence; no model review."

  review:
    # The Action parses the first command line; keep this filter broad enough
    # for leading whitespace, varied spacing, and explanation below it.
    if: >-
      (github.event_name == 'pull_request_target' &&
        !github.event.pull_request.draft &&
        !(github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.head.ref == 'changeset-release/main' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login == 'effect-agent[bot]')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        contains(github.event.comment.body, '@effect-agent')) ||
      github.event_name == 'workflow_dispatch'
    # Rejected comments must not displace an admitted review waiting for this PR.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pr-review
      deployment: false
    steps:
      - name: Check out trusted repository guidance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job has secrets and write permissions. Never execute PR-head code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the Effect Agent GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-checks: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review the pull request
        uses: yielded-dev/agent/action@action-v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
          review-author: effect-agent[bot]
          check-name: Effect Agent review
          checks-token: ${{ steps.app-token.outputs.token }}
          mode: ${{ github.event_name == 'pull_request_target' && 'auto' || github.event_name == 'workflow_dispatch' && 'full' || 'incremental' }}
          command: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          comment-id: ${{ github.event.comment.id || 0 }}
          expected-head: ${{ github.event.pull_request.head.sha || '' }}
          automatic-review-limit: 5
          guidance-file: .github/review-guidance.md
          model: gpt-6.1-sol
          web-search: "true"
          effort: medium
          priority: ultrafast
          base-cost-usd: "20.00"
          max-cost-usd: "25.00"
          ignore: "bun.lock,action/dist/**,**/CHANGELOG.md,.agents/skills/**,.claude/skills/**"
