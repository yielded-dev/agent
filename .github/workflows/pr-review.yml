name: PR Review

on:
  # Review immediately using trusted code; PR source is read only through the API.
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number for a full review
        required: true
        type: number

permissions:
  contents: read
  checks: write

jobs:
  review:
    # The Action parses the first command line; keep this filter broad enough
    # for leading whitespace, varied spacing, and explanation below it.
    if: >-
      (github.event_name == 'pull_request_target' &&
        !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        contains(github.event.comment.body, '@effect-agent')) ||
      github.event_name == 'workflow_dispatch'
    # Rejected comments must not displace an admitted review waiting for this PR.
    concurrency:
      group: pr-review-${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pr-review
      deployment: false
    steps:
      - name: Check out trusted repository guidance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job has secrets and write permissions. Never execute PR-head code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the Effect Agent GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review the pull request
        uses: yielded-dev/agent/action@9b953c3cd0a94c4e47ebb280501f26bfdecd22a6 # action-v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token }}
          pull-request: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pull-request }}
          review-author: effect-agent[bot]
          check-name: Effect Agent review
          checks-token: ${{ github.token }}
          mode: ${{ github.event_name == 'pull_request_target' && 'auto' || github.event_name == 'workflow_dispatch' && 'full' || 'incremental' }}
          command: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          comment-id: ${{ github.event.comment.id || 0 }}
          expected-head: ${{ github.event.pull_request.head.sha || '' }}
          automatic-review-limit: 5
          guidance-file: .github/review-guidance.md
          model: gpt-6.1-sol
          web-search: "true"
          effort: medium
          priority: fast
          base-cost-usd: "20.00"
          max-cost-usd: "25.00"
          ignore: "bun.lock,action/dist/**,**/CHANGELOG.md,.agents/skills/**,.claude/skills/**"
