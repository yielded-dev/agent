name: PR Review

on:
  # CI uses GitHub's native fork approval. Only a completed, admitted CI run
  # can start an automatic review with repository secrets.
  workflow_run:
    workflows: [CI]
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  checks: write

jobs:
  resolve:
    # Comment commands retain their existing maintainer authorization.
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.path == '.github/workflows/ci.yml' &&
        (github.event.workflow_run.conclusion == 'success' ||
         github.event.workflow_run.conclusion == 'failure')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR') &&
        contains(github.event.comment.body, '@effect-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
    steps:
      - name: Resolve the admitted PR head
        id: pr
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea9 # v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              core.setOutput('number', context.payload.issue.number);
              return;
            }
            const run = context.payload.workflow_run;
            if (run.repository.id !== context.payload.repository.id || !run.head_repository) return;
            // Fork runs can omit pull_requests. Resolve through GitHub's API,
            // never through artifacts or code from the untrusted CI run.
            const candidates = run.pull_requests.length ? run.pull_requests :
              await github.paginate(github.rest.pulls.list, {
                ...context.repo, state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
            for (const candidate of candidates) {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo, pull_number: candidate.number,
              });
              if (pr.state !== 'open' || pr.draft || pr.head.sha !== run.head_sha ||
                  pr.head.repo?.id !== run.head_repository.id ||
                  pr.base.repo.id !== context.payload.repository.id) continue;
              const files = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo, pull_number: pr.number, per_page: 100,
              });
              // Preserve the generated-release metadata exclusion.
              const generated = /^(?:\.changeset\/|bun\.lock$|packages\/[^/]+\/(?:CHANGELOG\.md|package\.json)$)/;
              if (files.length && files.every(file => generated.test(file.filename) &&
                  (!file.previous_filename || generated.test(file.previous_filename)))) continue;
              core.setOutput('number', pr.number);
              core.setOutput('head', run.head_sha);
              return;
            }

  review:
    needs: resolve
    if: needs.resolve.outputs.number != ''
    concurrency:
      group: pr-review-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pr-review
      deployment: false
    steps:
      - name: Check out the trusted review channel
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Never check out or execute PR-head code in this privileged job.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mint the Effect Agent GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.EFFECT_AGENT_APP_ID }}
          private-key: ${{ secrets.EFFECT_AGENT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review the pull request
        uses: yielded-dev/agent/action@action-v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ steps.app-token.outputs.token }}
          pull-request: ${{ needs.resolve.outputs.number }}
          review-author: effect-agent[bot]
          check-name: Effect Agent review
          checks-token: ${{ github.token }}
          mode: ${{ github.event_name == 'workflow_run' && 'auto' || 'incremental' }}
          command: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          comment-id: ${{ github.event.comment.id || 0 }}
          automatic-review-limit: 5
          expected-head: ${{ needs.resolve.outputs.head || '' }}
          guidance-file: .github/review-guidance.md
          model: gpt-6.1-sol
          effort: medium
          priority: fast
          base-cost-usd: "20.00"
          max-cost-usd: "25.00"
          ignore: "bun.lock,action/dist/**,**/CHANGELOG.md,.agents/skills/**,.claude/skills/**"
