name: Deploy Sandbox

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  deploy:
    # Only the current main revision, validated by this repository's push CI.
    if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/ci.yml' && github.event.workflow_run.head_sha == github.sha }}
    concurrency:
      group: deploy-sandbox-production
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the validated revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - name: Build Sandbox
        working-directory: examples/sandbox
        run: vp build

      - name: Deploy Sandbox
        working-directory: examples/sandbox
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          LATEST_MAIN="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$LATEST_MAIN" != "$DEPLOY_SHA" ]; then
            echo "Skipping superseded Sandbox revision $DEPLOY_SHA." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          vp exec wrangler deploy
