name: Deploy Agent demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-travel-planner-production
  cancel-in-progress: false

env:
  CI: "true"
  VP_GIT_HOOKS: "0"

jobs:
  deploy:
    # Manual dispatch deploys the selected ref for explicitly authorized hosted checks.
    # Automatic deployments remain limited to main after the initial cutover.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && vars.TRAVEL_PLANNER_DEPLOY_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          version: "1.1.0"
          node-version: "24"
          run-install: false
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile --ignore-scripts

      - name: Check applications
        run: vp run -F @yielded/agent-example-travel-planner -F @yielded/agent-example-browser-speed check

      - name: Test applications
        run: vp run -F @yielded/agent-example-travel-planner -F @yielded/agent-example-browser-speed test

      - name: Detach the browser lab from retired auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A foreign binding must not retain the namespace being deleted. On later
          # deploys the lab already targets PlannerAuthV2 and this step does nothing.
          vp exec curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/yielded-agent-browser-use/settings" \
            > "$RUNNER_TEMP/browser-settings.json"
          vp exec jq -e '.success == true and (.result.bindings | type == "array")' "$RUNNER_TEMP/browser-settings.json"
          if vp exec jq -e '.result.bindings | any(.name == "AUTH" and .class_name == "PlannerAuth" and .script_name == "effect-agent-travel-planner")' "$RUNNER_TEMP/browser-settings.json"; then
            vp exec cp examples/browser-speed/wrangler.jsonc "$RUNNER_TEMP/browser-wrangler.jsonc"
            trap 'vp exec cp "$RUNNER_TEMP/browser-wrangler.jsonc" examples/browser-speed/wrangler.jsonc' EXIT
            vp exec node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "examples/browser-speed/wrangler.jsonc";
          const source = readFileSync(path, "utf8");
          const binding = /\{\s*"name": "AUTH",\s*"class_name": "PlannerAuthV2",\s*"script_name": "effect-agent-travel-planner",?\s*\},?/g;
          if ([...source.matchAll(binding)].length !== 1) throw new Error("Expected exactly one browser auth binding");
          writeFileSync(path, source.replace(binding, ""));
          JS
            vp run -F @yielded/agent-example-browser-speed deploy:public
          elif vp exec jq -e '.result.bindings | any(.name == "AUTH")' "$RUNNER_TEMP/browser-settings.json"; then
            vp exec jq -e '.result.bindings | any(.name == "AUTH" and .class_name == "PlannerAuthV2" and .script_name == "effect-agent-travel-planner")' "$RUNNER_TEMP/browser-settings.json"
          fi

      - name: Deploy with Alchemy
        env:
          # Same account and remote Alchemy state credentials as Deploy docs.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_ORIGIN: https://agent.yielded.dev
          AUTH_YIELDED_ISSUER: https://auth.yielded.dev
          AUTH_YIELDED_CLIENT_SECRET: ${{ secrets.TRAVEL_PLANNER_YIELDED_CLIENT_SECRET }}
          AUTH_EMAIL_FROM: auth@effect-agent.com
          AUTH_GITHUB_CLIENT_ID: ${{ secrets.TRAVEL_PLANNER_GITHUB_CLIENT_ID }}
          AUTH_GITHUB_CLIENT_SECRET: ${{ secrets.TRAVEL_PLANNER_GITHUB_CLIENT_SECRET }}
          AUTH_BINDING_KEY: ${{ secrets.TRAVEL_PLANNER_AUTH_BINDING_KEY }}
          AUTH_PROOF_KEY: ${{ secrets.TRAVEL_PLANNER_AUTH_PROOF_KEY }}
          AUTH_TRANSACTION_KEY: ${{ secrets.TRAVEL_PLANNER_AUTH_TRANSACTION_KEY }}
          BYOK_ENCRYPTION_KEY: ${{ secrets.TRAVEL_PLANNER_BYOK_ENCRYPTION_KEY }}
          SERVER_OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID AUTH_GITHUB_CLIENT_ID AUTH_GITHUB_CLIENT_SECRET AUTH_YIELDED_CLIENT_SECRET AUTH_BINDING_KEY AUTH_PROOF_KEY AUTH_TRANSACTION_KEY BYOK_ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing deployment configuration: $name"
              exit 1
            fi
          done
          vp run -F @yielded/agent-example-travel-planner deploy --yes

      - name: Deploy browser lab
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: vp run -F @yielded/agent-example-browser-speed deploy:public

      - name: Enable traces with query-string redaction
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Alchemy's SDK omits redact_query_string. Verify Cloudflare accepts it
          # while tracing is disabled before enabling collection.
          settings_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/effect-agent-travel-planner/script-settings"
          for tracing in false true; do
            jq -n --argjson tracing "$tracing" '{observability: {
              enabled: true,
              redact_query_string: true,
              logs: {enabled: true, invocation_logs: false},
              traces: {enabled: $tracing, persist: true, head_sampling_rate: 1}
            }}' > "$RUNNER_TEMP/planner-observability.json"
            curl --fail --silent --show-error --max-time 30 \
              --request PATCH "$settings_url" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary "@$RUNNER_TEMP/planner-observability.json" \
              | jq -e '.success == true'
            curl --fail --silent --show-error --max-time 30 \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$settings_url" \
              | jq -e --argjson tracing "$tracing" '
                .success == true and
                .result.observability.redact_query_string == true and
                .result.observability.logs.invocation_logs == false and
                .result.observability.traces.enabled == $tracing and
                .result.observability.traces.persist == true'
          done
